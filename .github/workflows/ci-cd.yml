name: WayFind CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"

  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build --build-arg RENDER_GIT_COMMIT=${{ github.sha }} -t wayfind:ci .

      - name: Run Docker container
        run: docker run -d --name wayfind-smoke -p 3000:3000 wayfind:ci

      - name: Test health endpoint
        run: |
          sleep 3
          curl --fail http://localhost:3000/health

      - name: Stop Docker container
        if: always()
        run: docker stop wayfind-smoke

      - name: Deploy to Render
        if: success()
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"